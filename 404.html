<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Meria Studio</title>
  <script>
    const redirects = {
      '/index.html': '/',
      '/work.html': '/work/',
      '/services.html': '/services/',
      '/contact.html': '/contact/',
        '/terms.html': '/terms/',
      '/privacy.html': '/privacy/'
    };
    const target = redirects[window.location.pathname];
    if (target) window.location.replace(target);
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="section">
    <p class="eyebrow">404</p>
    <h1>Page not found.</h1>
    <p class="section-copy">The page you are looking for has moved.</p>
    <a href="/" class="button dark">Return Home</a>
  </main>
</body>
</html>
